[project]
name = "hedge-scanner"
version = "0.1.0"
description = "Read-only perps portfolio and hedge opportunity scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "base58>=2.1",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
hedge-scanner = "hedge_scanner.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Import the package from the source tree so the suite runs even when the
# editable install has not been (re)synced.
pythonpath = ["."]

# basedpyright / pyright read this table. Without it the editor's type-checker
# defaults to a system Python that has no typer, no rich, no httpx, etc. and
# lights up every third-party import as "unresolved". Runtime is fine either
# way — this only silences editor noise. `venv` + `venvPath` are the pyright
# names; both linters honour them.
[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["hedge_scanner", "tests"]
# uv marks .venv contents with the macOS UF_HIDDEN bit (see CONTRACT.md §12.2);
# pyright's default extraPaths don't cover it, so add the site-packages dir
# explicitly. The Python version segment is hardcoded because it's what uv
# installs; if you bump requires-python, bump this too.
extraPaths = [".venv/lib/python3.11/site-packages"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hedge_scanner"]

# Vercel FastAPI detection. app.py re-exports hedge_scanner.web:app; this
# table names that entry so a Git/upload deploy still finds it.
[tool.vercel]
entrypoint = "app:app"
